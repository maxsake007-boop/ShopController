<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Agora - Business Control</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6400">
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#FF6400',
                        'accent-hover': '#E65100',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- Application Styles -->
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="h-[100dvh] min-h-[100dvh] flex overflow-hidden text-base bg-slate-50 font-sans antialiased selection:bg-accent/10">

    <!-- SIDEBAR -->
    <nav class="w-24 bg-white border-r border-slate-200 hidden md:flex flex-col flex-shrink-0 app-sidebar overflow-y-auto custom-scrollbar">
        <div class="h-16 md:h-20 flex items-center justify-center border-b border-slate-100 flex-shrink-0 logo-header">
            <img src="icons/icon-192.png" alt="Agora" class="w-10 h-10 md:w-12 md:h-12 rounded-2xl shadow-lg shadow-accent/20 object-cover logo-box">
        </div>
        
        <div class="flex-1 py-3 md:py-6 px-1.5 md:px-2 space-y-1.5 md:space-y-3 flex flex-col items-center sidebar-nav" id="nav-links">
            <!-- Nav items generated by JS -->
        </div>

        <div class="p-2 md:p-4 text-[10px] md:text-[11px] font-black text-slate-400 border-t border-slate-50 text-center uppercase tracking-wider flex-shrink-0 sidebar-version">
            v2.0
        </div>
    </nav>

    <!-- MAIN AREA -->
    <div id="app-main-area" class="flex-1 flex flex-col min-w-0 bg-[#F8F9FA] relative h-full min-h-0 overflow-hidden">
        <!-- Header (Desktop) -->
        <header class="h-11 md:h-12 lg:h-14 bg-white border-b border-slate-200 hidden md:flex items-center justify-between px-3 md:px-5 flex-shrink-0 desktop-header">
            <div class="flex items-center gap-2">
                <h1 class="text-xs md:text-sm font-black uppercase italic text-slate-800 tracking-wider" id="current-tab-label">Касса</h1>
                <span class="text-[9px] font-black tracking-wider bg-orange-100 text-accent px-1.5 py-0.5 rounded-full uppercase">v2.0</span>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Tablet Zoom Pill Controller (Visible only on tablet landscape <=1024px x <=550px) -->
                <div class="tab-zoom-pill items-center gap-1 bg-slate-100 p-0.5 sm:p-1 rounded-full border border-slate-200 shadow-2xs" title="Масштаб для планшета">
                    <button type="button" onclick="changeTabletZoom(-0.05)" class="w-6 h-6 rounded-full bg-white hover:bg-slate-200 active:scale-95 text-slate-700 font-black text-xs flex items-center justify-center shadow-xs transition-all touch-manipulation cursor-pointer" aria-label="Уменьшить масштаб">−</button>
                    <button type="button" onclick="resetTabletZoom()" id="tablet-zoom-value" class="px-1.5 text-[11px] font-black text-slate-700 hover:text-accent select-none cursor-pointer" title="Сбросить масштаб (70%)">70%</button>
                    <button type="button" onclick="changeTabletZoom(0.05)" class="w-6 h-6 rounded-full bg-white hover:bg-slate-200 active:scale-95 text-slate-700 font-black text-xs flex items-center justify-center shadow-xs transition-all touch-manipulation cursor-pointer" aria-label="Увеличить масштаб">+</button>
                </div>
                <div id="desktop-lang-container"></div>
            </div>
        </header>

        <!-- Mobile Header -->
        <header class="bg-white border-b sticky top-0 z-40 md:hidden px-3 h-11 flex items-center justify-between flex-shrink-0 mobile-header">
            <div class="flex items-center gap-2">
                <img src="icons/icon-192.png" alt="Agora" class="w-5 h-5 rounded-md object-cover">
                <h1 class="text-xs font-black text-accent italic uppercase app-name-display">Agora</h1>
                <span class="text-[8px] font-black tracking-wider bg-orange-100 text-accent px-1.5 py-0.5 rounded-full uppercase">v2.0</span>
            </div>
            <div id="mobile-lang-container" class="scale-90"></div>
        </header>

        <!-- Dynamic Content -->
        <main class="flex-1 overflow-y-auto p-2.5 sm:p-3.5 md:p-4 lg:p-6 pb-28 md:pb-8 custom-scrollbar touch-pan-y min-h-0" id="main-content">
            <!-- Content injection here -->
        </main>
    </div>

    <!-- Mobile Nav -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t px-1 flex justify-around items-center z-40 h-14 shadow-inner mobile-nav" id="mobile-nav">
        <!-- Generated by JS -->
    </nav>

    <!-- TOASTS -->
    <div id="toast-container" class="fixed top-3 right-3 z-50 flex flex-col gap-2 pointer-events-none max-w-[90vw]"></div>

    <!-- MODALS CONTAINER -->
    <div id="modal-container"></div>

    <!-- APPLICATION SCRIPTS (Modular Architecture) -->
    <script src="js/config.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/db.js"></script>
    <script src="js/photo.js"></script>
    <script src="js/activation.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tablet-zoom.js"></script>
    <script src="js/views/kassa.js"></script>
    <script src="js/views/sklad.js"></script>
    <script src="js/views/dolgi.js"></script>
    <script src="js/views/reports.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
