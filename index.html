    <style>
        html, body {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
        }

        body.modal-open {
            overflow: hidden !important;
        }

        .no-print { @apply block; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-only { display: block !important; }
        }

        .custom-scrollbar { -webkit-overflow-scrolling: touch; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
        
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-in { animation: floatIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .simultaneous-group-item {
            background-color: rgba(255, 138, 0, 0.035) !important;
        }
        .simultaneous-group-item:hover {
            background-color: rgba(255, 138, 0, 0.06) !important;
        }
        
        /* Prevent persistent focus/active outline or border styling on product cards */
        .product-card {
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .product-card:focus, .product-card:focus-visible, .product-card:active {
            outline: none !important;
            box-shadow: none !important;
        }
        
        /* Only apply hover border color changes on devices with hover capabilities and precision pointers */
        @media (hover: hover) and (pointer: fine) {
            .product-card:not(.cursor-not-allowed):hover {
                border-color: #FF6B00 !important;
            }
        }

        /* Sticky table header support */
        .sticky-table-header th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #F8FAFC;
        }

        /* Tablet Zoom Pill Controller (hidden on desktop) */
        .tab-zoom-pill {
            display: none;
        }

        /* Tablet Landscape Adaptation Rule (960x280–446 Viewport) */
        @media (max-width: 1024px) and (max-height: 550px) {
            html {
                zoom: normal !important;
                font-size: 16px !important;
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
            }

            body {
                zoom: var(--tablet-zoom, 0.70) !important;
                width: calc(100vw / var(--tablet-zoom, 0.70)) !important;
                max-width: calc(100vw / var(--tablet-zoom, 0.70)) !important;
                height: calc(100dvh / var(--tablet-zoom, 0.70)) !important;
                min-height: calc(100dvh / var(--tablet-zoom, 0.70)) !important;
                max-height: calc(100dvh / var(--tablet-zoom, 0.70)) !important;
                overflow: hidden !important;
                -webkit-text-size-adjust: 100%;
            }

            .tab-zoom-pill {
                display: inline-flex !important;
            }

            .kassa-product-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
                gap: 0.625rem !important;
            }

            .kassa-cart-aside {
                width: 380px !important;
                min-width: 360px !important;
            }

            .dashboard-chart-card {
                min-height: 300px !important;
                height: 320px !important;
            }
        }
    </style>

    <script>
        // --- TABLET ZOOM CONTROLLER ---
        const TABLET_ZOOM_KEY = 'pos_tablet_zoom_v3';
        let tabletZoomLevel = (() => {
            try {
                const saved = localStorage.getItem(TABLET_ZOOM_KEY);
                if (saved) {
                    const parsed = parseFloat(saved);
                    if (parsed >= 0.5 && parsed <= 1.0) return Math.round(parsed * 100) / 100;
                }
            } catch (e) {}
            return 0.70; // Default 70% as requested by user
        })();

        const applyTabletZoom = () => {
            const isTabletLandscape = window.innerWidth <= 1024 && window.innerHeight <= 550;
            const zoomValEl = document.getElementById('tablet-zoom-value');
            if (zoomValEl) {
                zoomValEl.textContent = `${Math.round(tabletZoomLevel * 100)}%`;
            }

            if (isTabletLandscape) {
                document.documentElement.style.setProperty('--tablet-zoom', String(tabletZoomLevel));
                document.documentElement.style.fontSize = '';
                document.body.style.zoom = String(tabletZoomLevel);
                document.body.style.width = `calc(100vw / ${tabletZoomLevel})`;
                document.body.style.maxWidth = `calc(100vw / ${tabletZoomLevel})`;
                document.body.style.height = `calc(100dvh / ${tabletZoomLevel})`;
                document.body.style.minHeight = `calc(100dvh / ${tabletZoomLevel})`;
                document.body.style.maxHeight = `calc(100dvh / ${tabletZoomLevel})`;
            } else {
                document.documentElement.style.removeProperty('--tablet-zoom');
                document.documentElement.style.fontSize = '';
                document.body.style.zoom = '';
                document.body.style.width = '';
                document.body.style.maxWidth = '';
                document.body.style.height = '';
                document.body.style.minHeight = '';
                document.body.style.maxHeight = '';
            }
        };

        window.changeTabletZoom = (delta) => {
            let next = Math.round((tabletZoomLevel + delta) * 100) / 100;
            if (next < 0.5) next = 0.5;
            if (next > 1.0) next = 1.0;
            tabletZoomLevel = next;
            try {
                localStorage.setItem(TABLET_ZOOM_KEY, String(tabletZoomLevel));
            } catch (e) {}
            applyTabletZoom();
            window.dispatchEvent(new Event('resize'));
        };

        window.resetTabletZoom = () => {
            tabletZoomLevel = 0.70;
            try {
                localStorage.setItem(TABLET_ZOOM_KEY, '0.70');
            } catch (e) {}
            applyTabletZoom();
            window.dispatchEvent(new Event('resize'));
        };

        window.addEventListener('resize', applyTabletZoom);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyTabletZoom);
        } else {
            applyTabletZoom();
        }

        // --- DATABASE ---
        const db = new Dexie("ShopDatabase");
        db.version(1).stores({
            products: "++id, name, price, ost",
            sales: "++id, date, total, payment_method",
            debtors: "++id, name, debt",
            expenses: "++id, timestamp",
            settings: "key, value"
        });

        const migrateFromLocalStorage = async () => {
            const oldProducts = localStorage.getItem('mpro_products');
            const oldSales = localStorage.getItem('mpro_sales');
            const oldDebts = localStorage.getItem('mpro_debts');
            const oldExpenses = localStorage.getItem('mpro_expenses');
            const oldSettings = localStorage.getItem('mpro_settings');
            const oldLang = localStorage.getItem('mpro_lang');

            let migratedAny = false;

            if (oldProducts || oldSales || oldDebts || oldExpenses || oldSettings) {
                migratedAny = true;
                
                await db.transaction('rw', [db.products, db.sales, db.debtors, db.expenses, db.settings], async () => {
                    if (oldProducts) {
                        try {
                            const products = JSON.parse(oldProducts);
                            if (Array.isArray(products)) {
                                for (const p of products) {
                                    const initialStock = p.stock !== undefined ? p.stock : (p.ost !== undefined ? p.ost : 0);
                                    await db.products.add({
                                        id: p.id ? (isNaN(Number(p.id)) ? undefined : Number(p.id)) : undefined,
                                        name: p.name || '',
                                        price: p.salePrice || p.price || 0,
                                        ost: initialStock,
                                        salePrice: p.salePrice || p.price || 0,
                                        purchasePrice: p.purchasePrice || 0,
                                        stock: initialStock,
                                        photoUrl: p.photoUrl || ''
                                    });
                                }
                            }
                        } catch (e) { console.error(e); }
                    }

                    if (oldSales) {
                        try {
                            const sales = JSON.parse(oldSales);
                            if (Array.isArray(sales)) {
                                for (const s of sales) {
                                    await db.sales.add({
                                        id: s.id ? (isNaN(Number(s.id)) ? undefined : Number(s.id)) : undefined,
                                        date: s.timestamp || s.date || Date.now(),
                                        total: s.total || 0,

                                        items: s.items || [],
                                        displayTimestamp: s.displayTimestamp || ''
                                    });
                                }
                            }
                        } catch (e) { console.error(e); }
                    }

                    if (oldDebts) {
                        try {
                            const debts = JSON.parse(oldDebts);
                            if (Array.isArray(debts)) {
                                for (const d of debts) {
                                    const totalDebt = d.transactions?.reduce((sum, t) => t.type === 'debt' ? sum + t.amount : sum, 0) || 0;
                                    const totalPaid = d.transactions?.reduce((sum, t) => t.type === 'payment' ? sum + t.amount : sum, 0) || 0;
                                    const balance = totalDebt - totalPaid;
                                    await db.debtors.add({
                                        id: d.id ? (isNaN(Number(d.id)) ? undefined : Number(d.id)) : undefined,
                                        name: d.clientName || d.name || '',
                                        debt: balance,
                                        clientName: d.clientName || d.name || '',
                                        transactions: d.transactions || []
                                    });
                                }
                            }
                        } catch (e) { console.error(e); }
                    }

                    if (oldExpenses) {
                        try {
                            const expenses = JSON.parse(oldExpenses);
                            if (Array.isArray(expenses)) {
                                for (const e of expenses) {
                                    await db.expenses.add({
                                        id: e.id ? (isNaN(Number(e.id)) ? undefined : Number(e.id)) : undefined,
                                        timestamp: e.timestamp || Date.now(),
                                        amount: e.amount || 0,
                                        note: e.note || ''
                                    });
                                }

                    if (oldSettings) {

                            const settings = JSON.parse(oldSettings);

                            if (settings.currency) await db.settings.put({ key: 'currency', value: settings.currency });

                    }
                    if (oldLang) {
                        await db.settings.put({ key: 'lang', value: oldLang });
                    }
                });

                localStorage.clear();
            }
            return migratedAny;
        };

        const loadStateFromDb = async () => {

        const formatNumberString = (val) => {
            if (val === undefined || val === null || val === '') return '';
            const cleaned = val.toString().replace(/\D/g, '');
            if (!cleaned) return '';
            const num = parseInt(cleaned, 10);
            return isNaN(num) ? '' : num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        };

        const parseNumber = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            const cleaned = val.toString().replace(/,/g, '');
            const num = Number(cleaned);
            return isNaN(num) ? 0 : num;
        };

        window.handleNumericInput = (input) => {
            const selectionStart = input.selectionStart;
            const originalLength = input.value.length;

            const clean = input.value.replace(/\D/g, '');
            if (clean === '') {
                input.value = '';
                return;
            }

            const num = parseInt(clean, 10);
            const formatted = num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

            input.value = formatted;

            const newLength = input.value.length;
            const diff = newLength - originalLength;
            const pos = selectionStart + diff;
            input.setSelectionRange(pos, pos);
        };

        const formatDate = (ts) => {
            const d = new Date(ts);
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        };

        const getWeekNumber = (ts) => {
            const d = new Date(ts);
            d.setHours(0,0,0,0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        };

        const getStartTime = (filter) => {
            const now = new Date();
            if (filter === 'today') return new Date().setHours(0,0,0,0);
            if (filter === 'week') {
                const currentDay = now.getDay();
                const daysToMonday = currentDay === 0 ? 6 : currentDay - 1;
                const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysToMonday);
                startOfWeek.setHours(0,0,0,0);
                return startOfWeek.getTime();
            }
            if (filter === 'month') return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            if (filter === 'quarter') {
                const startMonthOfQuarter = Math.floor(now.getMonth() / 3) * 3;
                return new Date(now.getFullYear(), startMonthOfQuarter, 1).getTime();
            }
            if (filter === 'year') return new Date(now.getFullYear(), 0, 1).getTime();
            return 0;
        };

        const getClosedDeals = (startTime, endTime = Infinity) => {
            // 1. Get cash and card sales in the timeframe
            const cashCardSales = state.sales.filter(s => s.timestamp >= startTime && s.timestamp <= endTime && (s.paymentType === 'cash' || s.paymentType === 'card'));

            // 2. Clear out any other manual payments or debt calculations and get fully paid debt sales
            const fullyPaidDebtSales = [];
            state.debts.forEach(c => {
                // Get client debts and payments sorted chronologically
                const debtsList = c.transactions.filter(t => t.type === 'debt').sort((a,b) => a.timestamp - b.timestamp);
                const paymentsList = c.transactions.filter(t => t.type === 'payment').sort((a,b) => a.timestamp - b.timestamp);
                
                const totalPaid = paymentsList.reduce((sum, p) => sum + p.amount, 0);
                let cumulativeDebt = 0;

                debtsList.forEach(d => {
                    cumulativeDebt += d.amount;
                    if (totalPaid >= cumulativeDebt) {
                        // This debt sale is fully paid off.
                        // When was it fully paid?
                        let payoffTimestamp = d.timestamp;
                        let runningPaySum = 0;
                        for (const p of paymentsList) {
                            runningPaySum += p.amount;
                            if (runningPaySum >= cumulativeDebt) {
                                payoffTimestamp = p.timestamp;
                                break;
                            }
                        }

                        // Filter by payoff timestamp
                        if (payoffTimestamp >= startTime && payoffTimestamp <= endTime) {
                            const originalSale = state.sales.find(s => String(s.id) === String(d.saleId));
                            if (originalSale) {
                                fullyPaidDebtSales.push({
                                    ...originalSale,
                                    id: originalSale.id,
                                    timestamp: payoffTimestamp, // Override with payoff date for analytics/reports
                                    originalTimestamp: originalSale.timestamp, // Keep original sale timestamp if needed
                                    paymentType: 'Уплочен', // Amber/orange badge for completed debt sales
                                    items: originalSale.items && originalSale.items.length > 0 ? originalSale.items : (d.items || [])
                                });
                            } else {
                                fullyPaidDebtSales.push({
                                    id: `pmt-${payoffTimestamp}`,
                                    timestamp: payoffTimestamp,
                                    items: d.items || [],
                                    total: d.amount,
                                    paymentType: 'Уплочен',
                                    clientName: c.clientName
                                });
                            }
                        }
                    }
                });
            });

            return [...cashCardSales, ...fullyPaidDebtSales].sort((a,b) => b.timestamp - a.timestamp);

                                    <span class="flex items-center gap-2"><i data-lucide="shopping-cart" class="w-4 h-4 text-accent"></i> ${t('cart')}: ${formatPrice(total)} ${state.settings.currency} (${totalQty})</span>
                                    <span class="text-accent flex items-center gap-1 font-black">${t('pay')} <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></span>
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <!-- RIGHT: CART ASIDE (Independent Scroll + Pinned Footer) -->

                                            oninput="handleNumericInput(this)" 
                                            onchange="updatePrice('${item.productId}', this.value)"

                                </div>

                            ${state.kassa.order.length === 0 ? `<div class="text-center py-8 text-slate-300 italic text-xs uppercase font-bold tracking-widest opacity-60">${t('cart_empty')}</div>` : ''}

                                            ${tType === 'cash' ? t('cash') : tType === 'card' ? t('card') : t('debt')}
                                        </button>
                                    `).join('')}
                                </div>
                                ${state.kassa.paymentType === 'debt' ? `
                                    <input 
                                        type="text" 
                                        placeholder="${t('client_name_placeholder')}" 
                                        class="w-full bg-white/5 text-white placeholder:text-slate-500 px-3 py-2 text-xs border border-white/10 rounded-xl outline-none focus:border-accent font-bold min-h-[38px]" 
                                        value="${state.kassa.clientName}" 
                                        oninput="state.kassa.clientName=this.value"
                                    >
                                ` : ''}

                                    ${t('pay')}
                                </button>
                            </div>
                        </div>
                    </aside>
                </div>

        };

        window.filterProducts = (val) => {
            state.kassa.search = val;
            const query = val.toLowerCase();
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name') || '';
                if (name.includes(query)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        };

        window.addToOrder = (id) => {
            const p = state.products.find(x => String(x.id) === String(id));
            if (!p) return;
            const existing = state.kassa.order.find(i => String(i.productId) === String(id));
            const currentQty = existing ? existing.qty : 0;
            if (currentQty >= p.stock) {
                showToast(state.lang === 'ru' 
                    ? `Недостаточно на складе! Доступно: ${p.stock}` 
                    : `Omborda yetarli emas! Mavjud: ${p.stock}`);
                return;
            }
            if (existing) existing.qty++;
            else state.kassa.order.push({ productId: id, name: p.name, qty: 1, price: p.salePrice });
            render();
        };

        window.updateQty = (id, delta) => {
            const item = state.kassa.order.find(i => String(i.productId) === String(id));
            if (item) {
                if (delta > 0) {
                    const p = state.products.find(x => String(x.id) === String(id));
                    if (p && item.qty >= p.stock) {
                        showToast(state.lang === 'ru' 
                            ? `Недостаточно на складе! Доступно: ${p.stock}` 
                            : `Omborda yetarli emas! Mavjud: ${p.stock}`);
                        return;
                    }
                }
                item.qty += delta;
                if (item.qty <= 0) window.removeItem(id);
                else render();
            }
        };

        window.updatePrice = (id, val) => {
            const item = state.kassa.order.find(i => String(i.productId) === String(id));
            if (item) {
                item.price = parseNumber(val);
                render();
            }
        };

        window.removeItem = (id) => {
            state.kassa.order = state.kassa.order.filter(i => String(i.productId) !== String(id));
            render();
        };

        window.confirmSale = () => {
            if (state.kassa.order.length === 0) return;
            if (state.kassa.paymentType === 'debt' && !state.kassa.clientName.trim()) return alert(t('enter_client_name_toast'));
            
            const total = state.kassa.order.reduce((s, i) => s + (i.price * i.qty), 0);
            const saleData = {
                items: [...state.kassa.order],
                total: total,
                paymentType: state.kassa.paymentType,
                clientName: state.kassa.paymentType === 'debt' ? state.kassa.clientName : undefined
            };

            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div onclick="if(event.target===this) document.getElementById('modal-container').innerHTML=''" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 overflow-hidden">
                    <div class="bg-white rounded-2xl sm:rounded-3xl shadow-2xl w-full max-w-md flex flex-col max-h-[calc(100dvh-16px)] overflow-hidden animate-in scale-in">
                        <!-- Header -->
                        <div class="p-3 sm:p-4 text-center border-b flex-shrink-0 bg-slate-50/70">
                            <div class="w-10 h-10 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-1.5">
                                <i data-lucide="receipt" class="w-5 h-5"></i>
                            </div>
                            <h2 class="text-base sm:text-lg font-black uppercase italic tracking-tighter text-slate-800">${t('receipt')}</h2>
                            <div class="text-slate-400 text-[10px] sm:text-xs uppercase font-bold tracking-wider">${t('check_data')}</div>
                        </div>

                        <!-- Body (Scrollable) -->
                        <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 sm:p-5 space-y-2.5 touch-pan-y">
                            <div class="border-y border-dashed py-2 space-y-1.5 text-left">
                                ${saleData.items.map(i => `<div class="flex justify-between text-xs sm:text-sm"><span class="font-bold text-slate-700">${i.name} x ${i.qty}</span><b class="text-slate-900">${formatPrice(i.price*i.qty)}</b></div>`).join('')}
                            </div>
                            <div class="flex justify-between text-sm sm:text-base font-black text-left text-slate-900 pt-1">
                                <span>${t('total_receipt')}:</span>
                                <span>${formatPrice(saleData.total)} ${state.settings.currency}</span>
                            </div>
                            <div class="text-[10px] sm:text-xs uppercase font-bold text-slate-400 text-right tracking-wide">
                                ${t('payment_receipt')}: ${saleData.paymentType === 'cash' ? t('cash') : saleData.paymentType === 'card' ? t('card') : t('debt') + ' (' + saleData.clientName + ')'}
                            </div>
                        </div>

                        <!-- Pinned Footer -->
                        <div class="p-3 sm:p-4 border-t bg-slate-50/90 flex gap-3 flex-shrink-0 sticky bottom-0">
                            <button onclick="document.getElementById('modal-container').innerHTML=''" class="flex-1 min-h-[44px] py-2.5 border border-slate-200 text-slate-500 rounded-xl sm:rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-slate-100 active:scale-95 transition-all flex items-center justify-center">${t('cancel')}</button>
                            <button onclick="commitSale(${JSON.stringify(saleData).replace(/"/g, '&quot;')})" class="flex-1 min-h-[44px] py-2.5 bg-accent text-white rounded-xl sm:rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg shadow-orange-100 hover:bg-orange-600 active:scale-95 transition-all flex items-center justify-center">OK</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        window.commitSale = async (saleData) => {
            const timestamp = Date.now();
            
            // Record each item individually
            saleData.items.forEach((item, index) => {
                const individualId = `${timestamp}-${index}`;
                const individualSale = {
                    id: individualId,
                    timestamp: timestamp,
                    items: [item],
                    total: item.price * item.qty,
                    paymentType: saleData.paymentType,
                    clientName: saleData.clientName
                };
                state.sales.unshift(individualSale);

                // Update stock
                const p = state.products.find(x => String(x.id) === String(item.productId));
                if (p) {
                    p.stock = Math.max(0, p.stock - item.qty);
                    p.ost = p.stock;
                }

                // Update debts
                if (saleData.paymentType === 'debt') {
                    let debt = state.debts.find(d => d.clientName === saleData.clientName);
                    if (!debt) {
                        debt = { clientName: saleData.clientName, transactions: [] };
                        state.debts.push(debt);
                    }
                    debt.transactions.push({ 
                        type: 'debt', 
                        amount: item.price * item.qty, 
                        timestamp: timestamp, 
                        saleId: individualId,
                        items: [JSON.parse(JSON.stringify(item))]
                    });
                }
            });

            state.kassa.order = [];
            state.kassa.clientName = '';
            document.getElementById('modal-container').innerHTML = '';
            await saveState();
            showToast(t('sale_complete_toast'));
            render();
        };

        // SKLAD
        const renderSklad = () => `
            <div class="space-y-2.5 sm:space-y-4">
                <div class="flex justify-between items-center gap-2">
                    <h2 class="text-xs sm:text-base font-black uppercase italic text-slate-800 tracking-wider flex items-center gap-2"><i data-lucide="package" class="text-accent w-4 h-4 sm:w-5 sm:h-5"></i> ${t('sklad')}</h2>
                    <button onclick="toggleAddForm(true)" class="min-h-[36px] sm:min-h-[40px] bg-accent text-white px-3 sm:px-5 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl font-black flex items-center justify-center gap-1.5 hover:bg-orange-600 active:scale-95 transition-all text-[11px] sm:text-xs uppercase tracking-widest shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i> ${t('add_product')}</button>
                </div>
                <div class="bg-white rounded-xl sm:rounded-2xl border border-slate-200 shadow-sm overflow-hidden text-xs sm:text-sm">
                    <div class="overflow-x-auto overflow-y-auto max-h-[calc(100dvh-100px)] custom-scrollbar touch-pan-x touch-pan-y">
                        <table class="w-full text-left font-sans min-w-[540px]">
                            <thead class="sticky top-0 z-10 bg-slate-50 border-b text-[10px] sm:text-xs font-black uppercase text-slate-400 tracking-widest shadow-sm">
                                <tr>
                                    <th class="py-2 px-2.5 sm:py-2.5 sm:px-3.5">${t('photo')}</th>
                                    <th class="py-2 px-2.5 sm:py-2.5 sm:px-3.5">${t('name')}</th>
                                    <th class="py-2 px-2.5 sm:py-2.5 sm:px-3.5">${t('sale_short')}</th>
                                    <th class="py-2 px-2.5 sm:py-2.5 sm:px-3.5 flex items-center gap-1.5">
                                        ${t('purchase_short')} 
                                        <button onclick="state.showPurchasePrices = !state.showPurchasePrices; render()" class="hover:text-accent transition-colors p-0.5">
                                            <i data-lucide="${state.showPurchasePrices ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                                        </button>
                                    </th>
                                    <th class="py-2 px-2.5 sm:py-2.5 sm:px-3.5">${t('stock')}</th>
                                    <th class="py-2 px-2.5 sm:py-2.5 sm:px-3.5 text-right"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${state.products.map(p => `
                                    <tr class="hover:bg-slate-50/50 transition-colors group">
                                        <td class="py-1.5 px-2.5 sm:py-2 sm:px-3.5"><div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-slate-100 border border-slate-100 flex items-center justify-center overflow-hidden">${p.photoUrl ? `<img src="${p.photoUrl}" class="w-full h-full object-cover">` : '<i data-lucide="package" class="w-4 h-4 text-slate-400"></i>'}</div></td>
                                        <td class="py-1.5 px-2.5 sm:py-2 sm:px-3.5"><input class="w-full bg-transparent border-b border-transparent focus:border-accent outline-none font-bold text-slate-800 text-xs sm:text-sm py-1 min-h-[32px]" value="${p.name}" onchange="editProduct('${p.id}', 'name', this.value)"></td>
                                        <td class="py-1.5 px-2.5 sm:py-2 sm:px-3.5 font-black text-accent tracking-tighter text-xs sm:text-sm"><input type="text" inputmode="numeric" class="w-20 bg-transparent border-b border-transparent focus:border-accent outline-none font-black text-accent py-1 min-h-[32px]" value="${formatNumberString(p.salePrice)}" oninput="handleNumericInput(this)" onchange="editProduct('${p.id}', 'salePrice', this.value)"></td>
                                        <td class="py-1.5 px-2.5 sm:py-2 sm:px-3.5 font-bold text-slate-500 tracking-tighter text-xs sm:text-sm">
                                            <div class="flex items-center gap-1">
                                                ${(state.showPurchasePrices || state.visiblePurchasePrices.map(String).includes(String(p.id))) 
                                                    ? `<input type="text" inputmode="numeric" class="w-20 bg-transparent border-b border-transparent focus:border-accent outline-none font-bold text-slate-500 py-1 min-h-[32px]" value="${formatNumberString(p.purchasePrice)}" oninput="handleNumericInput(this)" onchange="editProduct('${p.id}', 'purchasePrice', this.value)">`
                                                    : '<span class="font-bold tracking-[0.1em] text-slate-300">••••</span>'
                                                }
                                                <button onclick="toggleRowPurchasePrice('${p.id}')" class="text-slate-400 hover:text-accent transition-all p-1 min-w-[30px] min-h-[30px] flex items-center justify-center">
                                                    <i data-lucide="${state.visiblePurchasePrices.map(String).includes(String(p.id)) ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                                                </button>
                                            </div>
                                        </td>
                                        <td class="py-1.5 px-2.5 sm:py-2 sm:px-3.5 text-xs sm:text-sm"><input type="text" inputmode="numeric" class="w-14 bg-transparent border-b border-transparent focus:border-accent outline-none py-1 min-h-[32px] ${p.stock <= 3 ? 'text-red-500 font-black' : 'font-bold text-slate-700'}" value="${formatNumberString(p.stock)}" oninput="handleNumericInput(this)" onchange="editProduct('${p.id}', 'stock', this.value)"></td>
                                        <td class="py-1.5 px-2.5 sm:py-2 sm:px-3.5 text-right"><button onclick="confirmDeleteProduct('${p.id}', '${p.name.replace(/'/g, "\\'")}')" class="text-slate-300 hover:text-red-500 active:scale-95 transition-colors p-1.5 min-w-[32px] min-h-[32px] inline-flex items-center justify-center"><i data-lucide="trash-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i></button></td>
                                    </tr>
                                `).join('')}
                                ${state.products.length === 0 ? `<tr><td colspan="6" class="p-8 text-center text-slate-350 italic text-xs">${t('no_records')}</td></tr>` : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div id="sklad-modal"></div>
        `;

        window.toggleRowPurchasePrice = (id) => {
            const strId = String(id);
            if (state.visiblePurchasePrices.map(String).includes(strId)) {
                state.visiblePurchasePrices = state.visiblePurchasePrices.filter(x => String(x) !== strId);
            } else {
                state.visiblePurchasePrices.push(id);
            }
            render();
        };

        window.confirmDeleteProduct = (id, name) => {
            const m = document.getElementById('modal-container');
            m.innerHTML = `
                <div onclick="if(event.target===this) document.getElementById('modal-container').innerHTML=''" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-4 overflow-hidden">
                    <div class="bg-white rounded-2xl sm:rounded-3xl shadow-2xl w-full max-w-md flex flex-col max-h-[calc(100dvh-16px)] overflow-hidden text-center animate-in scale-in">
                        <div class="p-4 sm:p-6 flex-1 min-h-0 overflow-y-auto custom-scrollbar touch-pan-y">
                            <div class="w-12 h-12 sm:w-16 sm:h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="alert-triangle" class="w-6 h-6 sm:w-8 sm:h-8"></i></div>
                            <h3 class="text-base sm:text-xl font-black uppercase italic text-slate-800 leading-tight">${t('confirm_delete_product')}</h3>
                            <p class="text-slate-400 text-xs sm:text-sm mb-2 mt-2 font-semibold uppercase tracking-wider leading-relaxed bg-slate-50/50 p-2.5 rounded-xl border border-dashed border-slate-200 break-words">${name}</p>
                        </div>
                        <div class="p-3 sm:p-4 border-t bg-slate-50 flex gap-3 flex-shrink-0 sticky bottom-0">
                             <button onclick="document.getElementById('modal-container').innerHTML=''" class="flex-1 min-h-[44px] py-2.5 border border-slate-200 rounded-xl sm:rounded-2xl font-black text-slate-500 hover:bg-slate-100 active:scale-95 transition-all uppercase text-xs tracking-widest flex items-center justify-center">${t('no')}</button>
                             <button onclick="document.getElementById('modal-container').innerHTML=''; deleteProduct('${id}')" class="flex-1 min-h-[44px] py-2.5 bg-red-500 text-white rounded-xl sm:rounded-2xl font-black hover:bg-red-600 active:scale-95 transition-all uppercase text-xs tracking-widest shadow-lg shadow-red-100 flex items-center justify-center">${t('yes')}</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        window.toggleAddForm = (show) => {
            const m = document.getElementById('sklad-modal');

                        if (tItem.type === 'debt') {
                            state.sales = state.sales.filter(s => String(s.id) !== String(tItem.saleId));

                        c.transactions.splice(idx, 1);
                        state.debts = state.debts.filter(x => x.transactions.length > 0);

                render();
                document.getElementById('modal-container').innerHTML = '';

        window.confirmDeleteSale = async (id) => {
            const pin = document.getElementById('delete-pin-input').value;
            if (pin === '1111') {
                if (id.toString().startsWith('pmt-')) {
                    const timestamp = parseInt(id.toString().replace('pmt-', ''));
                    state.debts.forEach(c => {
                        const oldLen = c.transactions.length;
                        c.transactions = c.transactions.filter(t => t.timestamp !== timestamp);

                } else {
                    const saleToRemove = state.sales.find(s => String(s.id) === String(id));
                    if (saleToRemove) {
                        if (saleToRemove.paymentType === 'debt') {
                            state.debts.forEach(c => {
                                c.transactions = c.transactions.filter(t => String(t.saleId) !== String(id));
                            });
                            state.debts = state.debts.filter(c => c.transactions.length > 0);
                        }
                        state.sales = state.sales.filter(s => String(s.id) !== String(id));

                render();
                document.getElementById('modal-container').innerHTML = '';

                const newPmtType = state.tempEdit.paymentType;

        const initCharts = () => {

            const startTime = getStartTime(state.dashboard.filter);
            
            const closedDealsForCharts = getClosedDeals(startTime);

            // Grouping for the line chart

                    const start = new Date();

                    end.setHours(h + 1);

            } else if (state.dashboard.filter === 'week') {
                chartLabels = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
                
                const now = new Date();
                const currentDay = now.getDay();
                const daysToMonday = currentDay === 0 ? 6 : currentDay - 1;
                const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysToMonday);
                startOfWeek.setHours(0, 0, 0, 0);

                chartData = [...Array(7)].map((_, i) => {

                    startDay.setDate(startOfWeek.getDate() + i);

            } else if (state.dashboard.filter === 'month') {

                const shortMonths = state.lang === 'uz'

                    : ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
                
                const startOfMonth = new Date(year, month, 1);

                chartLabels = [...Array(daysInMonth)].map((_, i) => {
                    const d = new Date(startOfMonth);
                    d.setDate(startOfMonth.getDate() + i);

                chartData = [...Array(daysInMonth)].map((_, i) => {
                    const startDay = new Date(startOfMonth);
                    startDay.setDate(startOfMonth.getDate() + i);
                    startDay.setHours(0, 0, 0, 0);

                    endDay.setDate(startDay.getDate() + 1);
                    
                    return closedDealsForCharts
                        .filter(s => s.timestamp >= startDay.getTime() && s.timestamp < endDay.getTime())

            } else if (state.dashboard.filter === 'quarter') {
                const now = new Date();
                const currentQuarterStartMonth = Math.floor(now.getMonth() / 3) * 3;

                    ? ["Yan", "Fev", "Mar", "Apr", "May", "Iyun", "Iyul", "Avg", "Sen", "Okt", "Noy", "Dek"]

                    shortMonths[currentQuarterStartMonth],
                    shortMonths[currentQuarterStartMonth + 1],
                    shortMonths[currentQuarterStartMonth + 2]

                    const m = currentQuarterStartMonth + offset;
                    const start = new Date(now.getFullYear(), m, 1);
                    start.setHours(0, 0, 0, 0);
                    const end = new Date(now.getFullYear(), m + 1, 1);
                    end.setHours(0, 0, 0, 0);
                    return closedDealsForCharts
                        .filter(s => s.timestamp >= start.getTime() && s.timestamp < end.getTime())
                        .reduce((sum, s) => sum + s.total, 0);

            } else { // 'year'
                const now = new Date();
                const shortMonths = state.lang === 'uz' 
                    ? ["Yan", "Fev", "Mar", "Apr", "May", "Iyun", "Iyul", "Avg", "Sen", "Okt", "Noy", "Dek"]
                    : ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];

                        ${state.lang === 'ru' ? 'Выберите нужный период для формирования и печати официального отчета в формате PDF.' : 'Rasmiy hisobotni PDF formatida yaratish va chop etish uchun kerakli davrni tanlang.'}

                        <button onclick="openClearDataModal()" class="w-full sm:w-auto px-4 py-2 sm:py-2.5 bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 rounded-xl font-black uppercase text-xs tracking-wider transition-all flex items-center justify-center gap-1.5 shadow-sm active:scale-95 min-h-[38px]">

        `;

        const getPeriodStats = (start, end) => {
            const closedDeals = getClosedDeals(start, end);
            const totalClosed = closedDeals.reduce((sum, s) => sum + s.total, 0);

            let profit = 0;
            closedDeals.forEach(sale => {
                sale.items.forEach(item => {
                    const product = state.products.find(p => String(p.id) === String(item.productId));
                    if (product) {
                        profit += (item.price - product.purchasePrice) * item.qty;
                    }
                });
            });

            const filteredExpenses = state.expenses.filter(e => e.timestamp >= start && e.timestamp <= end);
            const totalExpenses = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);

            return {
                revenue: totalClosed,
                profit: profit,
                totalExpenses: totalExpenses,
                netProfit: profit - totalExpenses,
                salesCount: closedDeals.length,
                closedDeals: closedDeals,
                expenses: filteredExpenses.sort((a, b) => b.timestamp - a.timestamp)
            };
        };

        window.printPdfReport = (periodType) => {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            let startTime, endTime, titleLabel, fileSuffix;

            const ruMonthsNominative = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            const uzMonthsNominative = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];

            if (periodType === 'month') {
                startTime = new Date(year, month, 1).getTime();
                endTime = new Date(year, month + 1, 0, 23, 59, 59, 999).getTime();
                const monthName = state.lang === 'ru' ? ruMonthsNominative[month] : uzMonthsNominative[month];
                titleLabel = `${monthName} ${year}`;
                fileSuffix = `${monthName}_${year}`;
            } else if (periodType === 'quarter') {
                const quarter = Math.floor(month / 3); // 0, 1, 2, 3
                const startQuarterMonth = quarter * 3;
                startTime = new Date(year, startQuarterMonth, 1).getTime();
                endTime = new Date(year, startQuarterMonth + 3, 0, 23, 59, 59, 999).getTime();
                titleLabel = state.lang === 'ru' ? `${quarter + 1}-й Квартал ${year}` : `${quarter + 1}-kvartal ${year}`;
                fileSuffix = `${quarter + 1}_kvartal_${year}`;
            } else { // year
                startTime = new Date(year, 0, 1).getTime();
                endTime = new Date(year, 11, 31, 23, 59, 59, 999).getTime();
                titleLabel = state.lang === 'ru' ? `${year} Год` : `${year}-yil`;
                fileSuffix = `god_${year}`;
            }

            const stats = getPeriodStats(startTime, endTime);
            const periodExpenses = stats.expenses;
            const closedDeals = stats.closedDeals;
            const totalClosed = stats.revenue;
            const totalExpenses = stats.totalExpenses;

            // Group deals by exact timestamp to group multiple items from the same checkout as a single deal
            const groupDealsByExactTimestamp = (deals) => {
                const timestampGroups = {};
                deals.forEach(deal => {
                    const isPmt = deal.id.toString().startsWith('pmt-');
                    if (!isPmt) {
                        const key = String(deal.timestamp);
                        if (!timestampGroups[key]) {
                            timestampGroups[key] = [];
                        }
                        timestampGroups[key].push(deal);
                    }
                });

                const result = [];
                const processedKeys = new Set();

                deals.forEach(deal => {
                    const isPmt = deal.id.toString().startsWith('pmt-');
                    if (isPmt) {
                        result.push({ isGroup: false, sale: deal, timestamp: deal.timestamp });
                    } else {
                        const key = String(deal.timestamp);
                        const group = timestampGroups[key];
                        if (group.length > 1) {
                            if (!processedKeys.has(key)) {
                                processedKeys.add(key);
                                result.push({
                                    isGroup: true,
                                    key: key,
                                    timestamp: group[0].timestamp,
                                    sales: group,
                                    total: group.reduce((sum, s) => sum + s.total, 0)
                                });
                            }
                        } else {
                            result.push({ isGroup: false, sale: deal, timestamp: deal.timestamp });
                        }
                    }
                });

                return result;
            };

            const printDisplayItems = groupDealsByExactTimestamp(closedDeals);

            const formatFriendlyDate = (ts) => {
                const d = new Date(ts);
                const day = d.getDate();
                const ruMonthsGenitive = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];
                const uzMonthsGenitive = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];
                const monthName = state.lang === 'ru' ? ruMonthsGenitive[d.getMonth()] : uzMonthsGenitive[d.getMonth()];
                return `${day} ${monthName} ${d.getFullYear()}`;

                            ${state.lang === 'ru' ? 'Отчёт по продажам и личным расходам' : 'Sotuvlar va shaxsiy xarajatlar hisoboti'}
                        </h2>
                        <h3 class="text-lg font-black mt-3 text-slate-800 uppercase tracking-wide">${titleLabel}</h3>
                        <div class="text-[9.5px] text-gray-400 mt-2.5 uppercase tracking-widest font-black flex items-center justify-center gap-1.5 bg-slate-50 py-1.5 px-4 rounded-xl w-max mx-auto border border-slate-100">
                            <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                            ${state.lang === 'ru' ? 'Сформировано' : 'Yaratilgan vaqt'}: ${new Date().toLocaleString(state.lang === 'ru' ? 'ru-RU' : 'uz-UZ')}
                        </div>
                    </div>
                    
                    <!-- Stats Section -->
                    <div class="grid grid-cols-4 gap-4 mb-8">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between h-24 text-left">
                            <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${t('revenue')}</div>
                            <div class="text-base font-black text-slate-900 leading-none">${formatPrice(totalClosed)}</div>
                        </div>
                        <div class="bg-emerald-50/40 p-5 rounded-2xl border border-emerald-150 shadow-sm flex flex-col justify-between h-24 text-left" style="background-color: rgb(236 253 245 / 0.4) !important; border-color: rgb(209 250 229 / 0.8) !important;">
                             <div class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">${t('profit')} 🎉</div>
                             <div class="text-base font-black text-emerald-800 leading-none">${formatPrice(stats.profit)}</div>
                        </div>
                        <div class="bg-red-50/40 p-5 rounded-2xl border border-red-150 shadow-sm flex flex-col justify-between h-24 text-left" style="background-color: rgb(254 242 242 / 0.4) !important; border-color: rgb(254 226 226 / 0.8) !important;">
                             <div class="text-[10px] font-black text-red-600 uppercase tracking-widest">${t('personal_expenses')} 💸</div>
                             <div class="text-base font-black text-red-800 leading-none">${formatPrice(totalExpenses)}</div>
                        </div>
                        <div class="bg-indigo-50/40 p-5 rounded-2xl border border-indigo-150 shadow-sm flex flex-col justify-between h-24 text-left" style="background-color: rgb(238 242 255 / 0.4) !important; border-color: rgb(224 231 255 / 0.8) !important;">
                             <div class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">${state.lang === 'ru' ? 'Чистыми 💰' : 'Sof foyda 💰'}</div>
                             <div class="text-base font-black text-indigo-850 leading-none">${formatPrice(stats.netProfit)}</div>
                        </div>
                    </div>

                    <!-- Transactions Section -->
                    <div class="space-y-4 mb-8 text-left">
                        <h3 class="text-sm font-black uppercase italic text-slate-500 flex items-center gap-2 ml-1">
                            <i data-lucide="check-circle-2" class="w-5 h-5 text-accent"></i> ${t('transactions')}
                        </h3>
                        <div class="space-y-4">
                            <!-- Headers for Perfect Align (Desktop first) -->
                            <div class="hidden md:grid grid-cols-12 gap-6 bg-slate-50 border border-slate-200/80 rounded-2xl px-6 py-4 text-[10.5px] font-black uppercase text-slate-400 tracking-widest items-center">
                                <div class="col-span-2">${state.lang === 'ru' ? 'ВРЕМЯ' : 'VAQT'}</div>
                                <div class="col-span-5">${state.lang === 'ru' ? 'ТОВАРЫ' : 'MAHSULOTLAR'}</div>
                                <div class="col-span-2 text-center">${state.lang === 'ru' ? 'СТАТУС' : 'HOLAT'}</div>
                                <div class="col-span-3 text-right">${state.lang === 'ru' ? 'ИТОГ' : 'SUMMA'}</div>
                            </div>

                            <div class="space-y-3">

        };

        window.confirmClearAllData = async () => {
            const codeInput = document.getElementById('clear-data-code-input');
            const code = codeInput.value;
            if (code === '0310') {
                await db.sales.clear();
                await db.expenses.clear();

                // Process debtors to only keep active unpaid debts, and clean their transactions list
                const newDebts = [];
                for (const d of state.debts) {
                    const debtsList = (d.transactions || []).filter(t => t.type === 'debt').sort((a,b) => a.timestamp - b.timestamp);
                    const paymentsList = (d.transactions || []).filter(t => t.type === 'payment').sort((a,b) => a.timestamp - b.timestamp);
                    
                    const totalPaid = paymentsList.reduce((sum, p) => sum + p.amount, 0);
                    const totalDebt = debtsList.reduce((sum, t) => sum + t.amount, 0);
                    const balance = totalDebt - totalPaid;

                    if (balance > 0) {
                        let runningPaid = totalPaid;
                        const cleanedTransactions = [];
                        
                        for (const debtItem of debtsList) {
                            if (runningPaid >= debtItem.amount) {
                                // Fully paid - discard this transaction
                                runningPaid -= debtItem.amount;
                            } else if (runningPaid > 0) {
                                // Partially paid - keep only the unpaid remaining amount
                                const unpaidAmount = debtItem.amount - runningPaid;
                                cleanedTransactions.push({
                                    ...debtItem,
                                    amount: unpaidAmount
                                });
                                runningPaid = 0;
                            } else {
                                // Completely unpaid - keep as is
                                cleanedTransactions.push(debtItem);
                            }
                        }

                        newDebts.push({
                            id: d.id,
                            clientName: d.clientName || d.name || '',
                            name: d.clientName || d.name || '',
                            debt: balance,
                            transactions: cleanedTransactions
                        });
                    }
                }

                await db.debtors.clear();
                for (const d of newDebts) {
                    await db.debtors.add({
                        id: d.id ? (isNaN(Number(d.id)) ? d.id : Number(d.id)) : undefined,
                        name: d.clientName || d.name || '',
                        debt: d.debt,
                        clientName: d.clientName || d.name || '',
                        transactions: d.transactions || []
                    });
                }

                state.sales = [];
                state.expenses = [];
                state.debts = newDebts;

                window.location.reload();
            } else {
                showToast(state.lang === 'ru' ? '❌ Неверный код' : '❌ Kod noto\'g\'ri');
                codeInput.value = '';
                codeInput.classList.add('border-red-500', 'animate-shake');
                setTimeout(() => codeInput.classList.remove('animate-shake'), 500);
            }
        };

        // MODAL SCROLL LOCK OBSERVER
        const updateModalBodyScrollLock = () => {
            const hasModal = ['modal-container', 'sklad-modal', 'debt-modal-root'].some(id => {
                const el = document.getElementById(id);
                return el && el.children.length > 0 && el.innerHTML.trim() !== '';
            });
            if (hasModal) {
                document.body.classList.add('modal-open');
            } else {
                document.body.classList.remove('modal-open');
            }
        };

        const modalObserver = new MutationObserver(updateModalBodyScrollLock);
        window.addEventListener('DOMContentLoaded', () => {
            ['modal-container', 'sklad-modal', 'debt-modal-root'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    modalObserver.observe(el, { childList: true, subtree: true });
                }
            });
            modalObserver.observe(document.body, { childList: true });
        });

        // INIT
        (async () => {
            try {
                await migrateFromLocalStorage();
                await loadStateFromDb();
            } catch (err) {
                console.error("Initialization error:", err);
            }
            const urlTab = new URLSearchParams(window.location.search).get('tab') || window.location.hash.replace('#', '');
            if (urlTab && ['kassa', 'sklad', 'dolgi', 'report', 'dashboard', 'settings'].includes(urlTab)) {
                state.activeTab = urlTab;
            }
            render();
            // Attach observer immediately as well
            ['modal-container', 'sklad-modal', 'debt-modal-root'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    modalObserver.observe(el, { childList: true, subtree: true });
                }
            });
            modalObserver.observe(document.body, { childList: true });
        })();

    </script>
</body>
</html>
